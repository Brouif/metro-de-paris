<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronologie du métro de Paris</title>
<meta name="description" content="L'expansion du métro parisien de 1900 à 2026, année par année, et les lignes en projet jusqu'en 2028.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">

  <header>
    <h1 data-i18n="title">Chronologie du métro de Paris</h1>
    <div class="header-end">
      <div class="subtitle" data-i18n="subtitle">L'expansion du réseau, 1900 – 2026, et ce qui vient</div>
      <div class="lang" id="lang" role="group" data-i18n-aria-label="lang.group">
        <button data-lang="fr" aria-pressed="true">FR</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <div class="timeline panel">
    <div class="transport">
      <button id="play" data-i18n-aria-label="play.start">
        <svg id="play-icon" viewBox="0 0 12 14" aria-hidden="true">
          <path d="M0 0 L12 7 L0 14 Z"/>
        </svg>
      </button>
      <button id="reverse" aria-pressed="false" data-i18n-aria-label="play.reverse">
        <svg viewBox="0 0 14 14" aria-hidden="true">
          <path d="M6 0.8 L0.3 4.2 L6 7.6 Z M8 6.4 L13.7 9.8 L8 13.2 Z"/>
        </svg>
      </button>
    </div>

    <div class="year-box">
      <div class="year" id="year" aria-live="polite">1900</div>
      <div class="year-flag" id="year-flag" data-i18n="year.planned">projet</div>
    </div>

    <div class="scrubber" id="scrubber" tabindex="0" role="slider"
         data-i18n-aria-label="scrubber"
         aria-valuemin="1900" aria-valuenow="1900">
      <div class="track"></div>
      <div class="fill" id="fill"></div>
      <!-- The projected stretch of the timeline, and the rule marking today.
           Drawn over the fill so scrubbing into the future still reads as
           projection. Positioned and shown by positionEra() in app.js. -->
      <div class="future" id="future"></div>
      <div class="today" id="today"></div>
      <div class="handle" id="handle"></div>
    </div>

    <div class="speed" id="speed" role="group" data-i18n-aria-label="speed">
      <button data-speed="1" aria-pressed="true">1&times;</button>
      <button data-speed="2" aria-pressed="false">2&times;</button>
      <button data-speed="4" aria-pressed="false">4&times;</button>
    </div>
  </div>

  <main>
    <div class="rail">
      <div id="legend" class="panel">
        <div class="legend-title" data-i18n="legend">Lignes en service</div>
        <div class="chips" id="chips"></div>
        <div class="legend-note" id="legend-note" data-i18n="legend.planned"></div>
      </div>

      <details class="notes panel">
        <summary data-i18n="notes.title">Noms historiques</summary>
        <div data-i18n-html="notes.body"></div>
      </details>
    </div>

    <div id="map" class="panel">
      <div class="zoom-controls">
        <button id="zoom-in" data-i18n-aria-label="zoom.in">+</button>
        <button id="zoom-out" data-i18n-aria-label="zoom.out">&minus;</button>
        <button id="zoom-reset" data-i18n-aria-label="zoom.reset">&#9678;</button>
      </div>
      <div class="hint" data-i18n="hint">Molette pour zoomer &middot; glisser pour déplacer</div>
      <button id="credits-open" class="credits-btn" data-i18n-aria-label="credits.open">&copy;</button>
    </div>
  </main>

</div>

<div id="tooltip" role="tooltip"></div>

<dialog id="credits" aria-labelledby="credits-title">
  <div class="credits-head">
    <h2 id="credits-title" data-i18n="credits.title">Sources et licences</h2>
    <button id="credits-close" data-i18n-aria-label="credits.close">&times;</button>
  </div>
  <div class="credits-body" data-i18n-html="credits.body"></div>
</dialog>

<script src="js/d3.v7.min.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
